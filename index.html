/* Layout: home sheet (chapters, combine, cases) → one question card at a time with a progress strip → results sheet */
:root {
  --bg: #eef1f4;

  --bad: #a3392f;

  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --surface: #1b222b; --fg: #e4e9ef; --muted: #98a5b4; --line: #2e3844;
    --accent: #7fa9d6; --accent-soft: #1f2d3c; --good: #6cc59a; --good-soft: #17301f;
    --bad: #ec8b80; --bad-soft: #3a1f1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1b222b; --fg: #e4e9ef; --muted: #98a5b4; --line: #2e3844;
  --accent: #7fa9d6; --accent-soft: #1f2d3c; --good: #6cc59a; --good-soft: #17301f;
  --bad: #ec8b80; --bad-soft: #3a1f1c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 660px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 650; font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 650; font-size: 1.15rem; margin: 0; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.progress { display: flex; gap: 2px; }
.progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress span.ok { background: var(--good); }
.progress span.no { background: var(--bad); }

.meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.chlist { display: flex; flex-direction: column; gap: 8px; }
.ch { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ch .num { flex: none; width: 34px; height: 34px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.ch .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ch .txt b { font-weight: 600; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; font: inherit; font-size: 15px; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; min-height: 48px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .letter { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct .letter { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.linkbtn { align-self: flex-start; background: none; border: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; padding: 4px 0; cursor: pointer; }
.hint { font-size: 14px; color: var(--muted); font-style: italic; }
.feedback { border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback strong { display: block; margin-bottom: 2px; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.next { font: inherit; font-weight: 600; font-size: 16px; background: var(--accent); color: var(--surface); border: none; border-radius: 10px; padding: 14px; cursor: pointer; min-height: 48px; width: 100%; }
.next:disabled { opacity: .45; cursor: default; }
.ghost { font: inherit; font-weight: 600; font-size: 15px; background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); border-radius: 10px; padding: 12px; cursor: pointer; min-height: 48px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > button { flex: 1 1 160px; }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.breakdown { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.breakdown div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.miss { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.miss .mq { font-weight: 600; }
.miss .yours { color: var(--bad); }
.miss .right { color: var(--good); }
textarea { width: 100%; min-height: 120px; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
@media (prefers-reduced-motion: no-preference) { .card { animation: in .2s ease-out; } @keyframes in { from { transform: translateY(4px); } to { transform: none; } } }
</style>

["A heart device maker argues that because the FDA approved its device, a patient's state negligence claim should be dismissed. What defense is this?","Federal preemption","State-of-the-art defense","Assumption of risk","Statute of repose","Look for the federal clue.","Preemption: meeting a federal standard overrides the state claim. Common with FDA devices, cigarettes, pesticides, boat propellers, and motor vehicles."],
["In which type of case is federal preemption most commonly raised?","Pesticides","Kitchen knives","Living room furniture","Children's clothing","Heavily federally regulated products.","Preemption comes up with cigarettes, FDA-approved medical devices, boat propellers, pesticides, and motor vehicles."],
["What is the standard for a design defect?","Whether the designer used reasonable care to make it safe for foreseeable use","Whether this unit departed from the company's blueprint","Whether the product was perfectly safe in every use","Whether it matched the industry's average safety level","A bad recipe, not one bad cookie.","Design defect: did the designer use reasonable care to make the product reasonably safe for its foreseeable use? Safer competing designs hurt the maker."],

["What is the legal standard for when a manufacturer has a duty to warn?","Whether the danger was reasonably foreseeable","Whether a federal agency required a label","Whether the maker knew the user personally","Whether every risk was listed on the label","Foreseeability.","The duty to warn turns on reasonable foreseeability, including how likely misuse is and whether the hazard is obvious."],
["A kitchen knife is sold with no label warning that it's sharp. A user cuts himself. Is it defective for failure to warn?","No, because the danger of a sharp knife is obvious","Yes, because every product needs a warning","Yes, because knives are unreasonably dangerous","No, because knives are unavoidably unsafe","Is the danger obvious?","There's no duty to warn about obvious dangers."],
["Why do many strict liability cases focus on failure to warn instead of proving a complex manufacturing defect?","Failure to warn is easier to prove and doesn't need costly experts","Failure to warn allows automatic punitive damages","Manufacturing defects aren't covered by 402A","Failure to warn claims avoid the statute of repose","Complex product, costs, experts.","Proving a defect in complex engineering needs expensive, hard-to-find experts. Showing a missing warning doesn't."],
["Which type of defect claim are injured plaintiffs most likely to bring?","Failure to warn","Manufacturing defect","Design defect","Breach of the warranty of title","The cheap, easy claim.","Failure to warn is the claim plaintiffs rely on most, because it's the easiest to prove."],
["According to your textbook, what is the primary role courts play in products liability law?","Deciding who pays the true costs of consumer products","Writing product safety standards","Approving products before they're sold","Protecting businesses from lawsuits","Policing the free enterprise system.","Courts police the free enterprise system by deciding how the true costs of consumer culture are allocated, especially when legislation falls short."],
["What does the Restatement (Section 402A) rule of strict liability focus on?","The condition of the product when it was sold","How carefully the seller made the product","Whether the buyer had a contract with the seller","Whether the seller promised it was safe","Strict liability = no excuses.","402A focuses on the product's condition, not the seller's care."],
["A helmet company runs the industry's most careful testing. One defective helmet still cracks and injures a rider. Under strict liability, is the company liable?","Yes, because the focus is on the product's condition","No, because it exercised all possible care","No, because the rider must prove negligence","Only if it violated a federal standard","Is being careful an excuse?","Strict liability applies even if the seller used all possible care."],
["Which of these is 'unreasonably dangerous' under the Restatement?","Coffee contaminated with cleaning chemicals","Hot coffee that can burn if spilled","Coffee with caffeine that keeps people awake","Coffee that stains teeth over time","Good whiskey vs. bad whiskey.","Unreasonably dangerous means dangerous beyond what the ordinary consumer would expect."],
["Which statement about defective condition is TRUE?","A product isn't defective if it was safe for normal handling when sold","A capped glass bottle is defective because it breaks if dropped","Candy is defective because too much makes you sick","Injury alone proves the product was defective","Safe for normal handling?","A product safe for normal handling and consumption isn't defective. Injury alone doesn't prove a defect."],
["A man eats three family-size bags of chips at once and gets sick. Are the chips 'defective' under 402A?","No, because they were safe for normal consumption","Yes, because the chips made him sick","Yes, because there was no portion warning","No, because food can never be defective","Like the textbook's candy example.","A product isn't defective just because overuse can cause harm."],

["A salesperson says a used car is in 'A-1 shape' and 'mechanically perfect.' It breaks down. Most likely:","This creates an express warranty","This is just puffery","This creates only an implied warranty of fitness","No warranty, because 'guarantee' wasn't used","Specific and measurable?","Specific factual claims create express warranties. No special words are needed."],
["A clerk says, 'This is the best vacuum on the market, you'll love it.' It's mediocre. Did the store breach an express warranty?","No, this is puffery, not a specific fact","Yes, any statement about quality is a warranty","Yes, because the clerk works for a merchant","No, because warranties must be in writing","Opinion or fact?","General praise and opinion are puffery, not warranties."],
["A paint store shows a color card labeled 'Ocean Blue.' The paint delivered is clearly green. What was breached?","An express warranty created by the sample","The implied warranty of merchantability","The implied warranty of fitness","The implied warranty of title","Did the seller show something?","An express warranty can come from a fact, a description, or a sample or model."],

["A man buys a TV with a two-year full warranty and sells it to his neighbor after six months. It breaks. Is the neighbor covered under Magnuson-Moss?","Yes, a full warranty covers any owner during the period","No, full warranties cover only the original buyer","No, warranties end when the product is sold","Only if he pays a transfer fee","Full = generous.","A full warranty covers anyone who owns the product during the warranty period."],

["A pedestrian is hit by a car with faulty brakes and sues the maker for negligence. What's the main advantage of negligence for her?","She doesn't need a contract with the manufacturer","She doesn't have to prove anyone was careless","She doesn't have to prove a defect","She can recover purely economic losses","Who can use negligence?","Negligence doesn't require privity."],
["A woman sells her old toaster at a yard sale. It shorts and burns the buyer. Is she strictly liable under 402A?","No, because she isn't in the business of selling toasters","Yes, because the toaster was defective","Yes, because she sold it for money","No, because used goods are excluded","Business seller?","Strict liability applies only to sellers in the business of selling that product."],
["A movie theater sells popcorn with a razor blade in it, arguing it's in the movie business. Under 402A:","The theater can be strictly liable","The theater wins because popcorn isn't its main business","Only the popcorn supplier can be liable","Only negligence can apply","Does it regularly sell popcorn?","A seller doesn't have to be solely in that business. A theater selling popcorn counts."],

const L = "ABCD";
const stage = document.getElementById("stage");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// Build item objects with stable ids
const BANK = [];
Object.keys(CH).forEach(n => CH[n].q.forEach((r, i) => BANK.push({ id: `c${n}-${i}`, ch: +n, chName: CH[n].name, p: r[0], right: r[1], wrong: r.slice(2, 5), h: r[5], e: r[6] })));
const CASEBANK = CASES.map((r, i) => ({ id: `case-${i}`, ch: 0, chName: r[0], assigned: r[1], name: r[2], p: r[3], right: r[4], wrong: r.slice(5, 8), h: r[8], e: r[9] }));

// Prefer questions not shown recently, then randomize
function draw(pool, n) {
  const seen = new Set(store.get("seen") || []);
  const fresh = shuffle(pool.filter(q => !seen.has(q.id)));
  const old = shuffle(pool.filter(q => seen.has(q.id)));
  const picked = fresh.concat(old).slice(0, n);
  const left = fresh.length - picked.length;
  // once every question in this pool has been seen, start over for it
  const next = left <= 0 ? [...seen].filter(id => !pool.some(q => q.id === id)) : [...seen];
  picked.forEach(q => next.push(q.id));
  store.set("seen", next.slice(-1500));
  return shuffle(picked).map(q => {
    const opts = shuffle([q.right, ...q.wrong]);
    return { ...q, opts, a: opts.indexOf(q.right) };
  });
}

let Q = [], i = 0, picks = [], label = "", count = 15, lastPool = null, lastLabel = "";
const prefs = store.get("prefs") || {};
if (prefs.count) count = prefs.count;

function bar() {
  const p = document.getElementById("progress"), m = document.getElementById("meta");
  if (!Q.length) { p.innerHTML = ""; m.innerHTML = ""; return; }
  p.innerHTML = Q.map((q, k) => `<span class="${picks[k] === null ? (k === i ? "cur" : "") : (picks[k] === q.a ? "ok" : "no")}"></span>`).join("");
  const right = picks.filter((v, k) => v === Q[k].a).length, done = picks.filter(v => v !== null).length;
  m.innerHTML = `<span>${esc(label)} · ${i < Q.length ? `Q${i + 1} of ${Q.length}` : "Finished"}</span><span>${right} / ${done} correct</span>`;
}

function countPicker() {
  const opts = [10, 15, 25, 0];
  return `<div class="count"><span>Questions per round</span><div class="seg" role="group" aria-label="Questions per round">${opts.map(o => `<button data-count="${o}" aria-pressed="${count === o}">${o === 0 ? "All" : o}</button>`).join("")}</div></div>`;
}

function home() {
  Q = []; picks = []; i = 0; bar();
  const sel = new Set(prefs.sel || [6, 7, 8, 9, 10]);
  const nA = CASEBANK.filter(c => c.assigned).length;
  stage.innerHTML = `
  <section class="card">
    <h2>Study one chapter</h2>
    <p class="note">Each round pulls a fresh set from the chapter's question bank and shuffles the answers.</p>
    ${countPicker()}
    <div class="chlist">${Object.keys(CH).map(n => `
      <div class="ch"><span class="num">${n}</span><span class="txt"><b>${esc(CH[n].name)}</b><small>${CH[n].q.length} questions in the bank</small></span>
      <button class="small-btn" data-study="${n}">Study</button></div>`).join("")}</div>
  </section>
  <section class="card">
    <h2>Combine chapters</h2>
    <p class="note">Check the chapters to mix. Questions are drawn from all of them at random.</p>
    <div class="chlist">${Object.keys(CH).map(n => `
      <label class="ch" for="mix${n}"><span class="num">${n}</span><span class="txt"><b>${esc(CH[n].name)}</b></span>
      <input type="checkbox" id="mix${n}" value="${n}" ${sel.has(+n) ? "checked" : ""}></label>`).join("")}</div>
    <button class="next" id="mixgo">Start combined quiz</button>
  </section>
  <section class="card">
    <h2>All cases</h2>
    <p class="note">${CASEBANK.length} case questions across chapters 6–10. ${nA} are on assigned cases from your course page.</p>
    <label class="toggle" for="assignedOnly"><input type="checkbox" id="assignedOnly" ${prefs.assignedOnly ? "checked" : ""}> Assigned cases only</label>
    <button class="next" id="casego">Start case quiz</button>
  </section>`;

  stage.querySelectorAll("[data-count]").forEach(b => b.onclick = () => {
    count = +b.dataset.count; prefs.count = count; store.set("prefs", prefs);
    stage.querySelectorAll("[data-count]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.count === count)));
  });
  stage.querySelectorAll("[data-study]").forEach(b => b.onclick = () => {
    const n = +b.dataset.study;
    run(BANK.filter(q => q.ch === n), `Ch ${n} · ${CH[n].name}`);
  });
  const mixBtn = document.getElementById("mixgo");
  const checks = [...stage.querySelectorAll('input[id^="mix"]')];
  const syncMix = () => {
    const chosen = checks.filter(c => c.checked).map(c => +c.value);
    prefs.sel = chosen; store.set("prefs", prefs);
    mixBtn.disabled = chosen.length === 0;
    mixBtn.textContent = chosen.length ? `Start combined quiz (${chosen.length} chapter${chosen.length > 1 ? "s" : ""})` : "Pick at least one chapter";
  };
  checks.forEach(c => c.onchange = syncMix); syncMix();
  mixBtn.onclick = () => {
    const chosen = checks.filter(c => c.checked).map(c => +c.value);
    run(BANK.filter(q => chosen.includes(q.ch)), chosen.length === 5 ? "All chapters" : `Ch ${chosen.join(", ")}`);
  };
  document.getElementById("assignedOnly").onchange = e => { prefs.assignedOnly = e.target.checked; store.set("prefs", prefs); };
  document.getElementById("casego").onclick = () => {
    const only = document.getElementById("assignedOnly").checked;
    run(only ? CASEBANK.filter(c => c.assigned) : CASEBANK, only ? "Assigned cases" : "All cases");
  };
}

function run(pool, lab) {
  lastPool = pool; lastLabel = lab; label = lab;
  Q = draw(pool, count === 0 ? pool.length : Math.min(count, pool.length));
  picks = new Array(Q.length).fill(null); i = 0; show(); window.scrollTo(0, 0);
}

function show() {
  bar();
  if (i >= Q.length) return results();
  const q = Q[i];
  const tags = q.ch ? `<span class="tag">Ch ${q.ch} · ${esc(q.chName)}</span>` : `<span class="tag">${esc(q.chName)}</span><span class="tag ${q.assigned ? "assigned" : ""}">${q.assigned ? "Assigned case" : "Reading case"}</span>`;
  stage.innerHTML = `<section class="card">
    <div class="tags">${tags}</div>
    <p class="q">${esc(q.p)}</p>
    <div class="opts">${q.opts.map((t, k) => `<button class="opt" data-k="${k}"><span class="letter">${L[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <button class="linkbtn" id="hintbtn">Show hint</button>
    <div class="hint" id="hint" hidden>${esc(q.h)}</div>
    <div id="fb"></div>
    <button class="linkbtn" id="quit">Quit to menu</button>
  </section>`;
  document.getElementById("hintbtn").onclick = () => { document.getElementById("hint").hidden = false; document.getElementById("hintbtn").hidden = true; };
  document.getElementById("quit").onclick = () => { home(); window.scrollTo(0, 0); };
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k) {
  const q = Q[i]; picks[i] = k;
  stage.querySelectorAll(".opt").forEach(b => {
    const n = +b.dataset.k; b.disabled = true;
    if (n === q.a) b.classList.add("correct"); else if (n === k) b.classList.add("wrong");
  });
  document.getElementById("hintbtn").hidden = true;
  const ok = k === q.a;
  document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "good" : "bad"}"><strong>${ok ? "Correct." : "Not quite. The answer is " + L[q.a] + "."}</strong>${q.name ? `<em>${esc(q.name)}.</em> ` : ""}${esc(q.e)}</div>
    <button class="next" id="next" style="margin-top:12px">${i === Q.length - 1 ? "See results" : "Next question"}</button>`;
  bar();
  const nx = document.getElementById("next");
  nx.onclick = () => { i++; show(); window.scrollTo(0, 0); };
  nx.focus({ preventScroll: true });
}

function summaryText() {
  const right = picks.filter((v, k) => v === Q[k].a).length;
  let t = `${label}: ${Math.round(right / Q.length * 100)}% (${right}/${Q.length})\n`;
  Q.forEach((q, k) => { if (picks[k] !== q.a) t += `\n• ${q.name ? q.name + ": " : ""}${q.p}\n  You answered: ${q.opts[picks[k]]}\n  Correct: ${q.opts[q.a]}\n`; });
  return t;
}

function results() {
  const right = picks.filter((v, k) => v === Q[k].a).length;
  const misses = Q.map((q, k) => ({ q, k })).filter(x => picks[x.k] !== x.q.a);
  const groups = {};
  Q.forEach((q, k) => { const g = q.ch ? `Ch ${q.ch} · ${q.chName}` : q.chName; groups[g] = groups[g] || [0, 0]; groups[g][1]++; if (picks[k] === q.a) groups[g][0]++; });
  const showGroups = Object.keys(groups).length > 1;
  stage.innerHTML = `<section class="card">
    <span class="eyebrow">${esc(label)}</span>
    <div class="score">${Math.round(right / Q.length * 100)}%</div>
    <div>${right} correct · ${Q.length - right} incorrect</div>
    ${showGroups ? `<div class="breakdown">${Object.entries(groups).map(([g, [r, t]]) => `<div><span>${esc(g)}</span><span>${r} / ${t}</span></div>`).join("")}</div>` : ""}
    ${misses.length ? misses.map(({ q, k }) => `<div class="miss">${q.name ? `<span class="mq">${esc(q.name)}</span>` : ""}<span class="${q.name ? "" : "mq"}">${esc(q.p)}</span><span class="yours">You: ${esc(q.opts[picks[k]])}</span><span class="right">Correct: ${esc(q.opts[q.a])}</span></div>`).join("") : `<div class="miss">Perfect round. Every answer was right.</div>`}
    <div class="row">
      ${misses.length ? `<button class="next" id="retrymiss">Retry the ${misses.length} I missed</button>` : ""}
      <button class="next" id="again">New round, same set</button>
    </div>
    <div class="row">
      <button class="ghost" id="copy">Copy results</button>
      <button class="ghost" id="menu">Back to menu</button>
    </div>
    <textarea id="out" readonly hidden></textarea>
  </section>`;
  if (misses.length) document.getElementById("retrymiss").onclick = () => {
    label = lastLabel + " · retry";
    Q = shuffle(misses.map(({ q }) => { const opts = shuffle([q.right, ...q.wrong]); return { ...q, opts, a: opts.indexOf(q.right) }; }));
    picks = new Array(Q.length).fill(null); i = 0; show(); window.scrollTo(0, 0);
  };
  document.getElementById("again").onclick = () => run(lastPool, lastLabel);
  document.getElementById("menu").onclick = () => { home(); window.scrollTo(0, 0); };
  document.getElementById("copy").onclick = () => {
    const txt = summaryText(), btn = document.getElementById("copy"), out = document.getElementById("out");
    const fallback = () => { out.hidden = false; out.value = txt; out.select(); btn.textContent = "Select and copy the text below"; };
    try { navigator.clipboard.writeText(txt).then(() => { btn.textContent = "Copied"; }, fallback); } catch (e) { fallback(); }
  };
}
home();
</script>
